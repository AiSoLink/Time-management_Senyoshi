<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>会社選択 - 時間管理システム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>時間管理システム</h1>
    <h2>前準備：会社を選択</h2>
    <p id="err" class="err" style="display:none;"></p>
    <p style="color:#666;margin-bottom:20px;line-height:1.6;">処理する会社を選択してください。</p>
    <div id="companies" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:16px;"></div>
  </div>

  <!-- 説明パネル（右サイドバー） -->
  <div class="guide-panel" id="guidePanel">
    <div class="panel-section-title">操作ガイド</div>
    <div id="guideContent"></div>
    <div class="panel-section-title panel-flow-title">作業の流れ</div>
    <div id="flowContent"></div>
  </div>

  <script src="app.js?v=20260810"></script>
  <script>
    var errEl = document.getElementById("err");
    var companiesEl = document.getElementById("companies");

    function showErr(msg) {
      errEl.textContent = msg || "";
      errEl.style.display = msg ? "block" : "none";
    }

    function updateGuide(title, description, steps) {
      var html = '';
      if (title) {
        html += '<div class="guide-step"><div class="guide-step-title">' + title + '</div>';
        if (description) {
          var descWithBreaks = description.replace(/\n/g, '<br>');
          html += '<div class="guide-step-desc">' + descWithBreaks + '</div>';
        }
        if (steps && steps.length > 0) {
          html += '<ul class="guide-checklist">';
          steps.forEach(function (step) {
            var stepWithBreaks = step.replace(/\n/g, '<br>');
            html += '<li>' + stepWithBreaks + '</li>';
          });
          html += '</ul>';
        }
        html += '</div>';
      }
      document.getElementById("guideContent").innerHTML = html;
    }

    updateGuide(
      "前準備：会社を選択",
      "処理する会社を\nクリックしてください。",
      [
        "会社ごとに乗務員の名簿を\n保持しています",
        "2回目以降は、名簿にいるのに\n日報が無い乗務員を\nお知らせします"
      ]
    );
    if (window.renderFlow) renderFlow("prep");

    apiGet("/api/companies")
      .then(function (data) {
        companiesEl.innerHTML = "";
        (data.companies || []).forEach(function (name) {
          var a = document.createElement("a");
          a.textContent = name;
          a.style.display = "block";
          a.style.padding = "20px";
          a.style.border = "1px solid #d4dae3";
          a.style.background = "#fff";
          a.style.borderRadius = "10px";
          a.style.textDecoration = "none";
          a.style.color = "#1d4ed8";
          a.style.fontWeight = "700";
          a.style.fontSize = "16px";
          a.style.textAlign = "center";
          a.style.cursor = "pointer";
          a.style.boxShadow = "0 1px 4px rgba(25, 40, 70, 0.06)";
          a.href = "device.html?company=" + encodeURIComponent(name);
          companiesEl.appendChild(a);
        });
        if (!(data.companies || []).length) {
          companiesEl.innerHTML = '<p style="color:#666;">会社が登録されていません。</p>';
        }
      })
      .catch(function (e) {
        var errMsg = String(e);
        showErr(errMsg);
        updateGuide("エラー", errMsg, []);
      });
  </script>
</body>
</html>
