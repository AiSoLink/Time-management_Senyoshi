<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>実行 - 時間管理システム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>時間管理システム</h1>
    <h2>2) ファイルをアップロード</h2>
    <p>機種：<b id="deviceLabel"></b></p>
    <p id="err" class="err" style="display:none;"></p>

    <div id="uploadSection">
      <div style="background:#f5f9ff;border:1px solid #dce8f5;border-radius:8px;padding:24px;margin-bottom:24px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:20px;margin-bottom:24px;">
          <div style="background:#white;padding:16px;border-radius:8px;border:1px solid #ddd;">
            <div style="font-weight:600;margin-bottom:8px;color:#1a1a1a;font-size:14px;" id="digitacoLabel">デジタコ（必須）</div>
            <input type="file" accept="application/pdf" multiple id="pdfs" style="width:100%;"/>
            <span id="pdfCount" style="display:block;margin-top:8px;font-size:12px;color:#999;"></span>
          </div>
          <div style="background:#white;padding:16px;border-radius:8px;border:1px solid #ddd;">
            <div style="font-weight:600;margin-bottom:8px;color:#1a1a1a;font-size:14px;">対面アルコール</div>
            <input type="file" multiple id="taimen" style="width:100%;"/>
            <span id="taimenCount" style="display:block;margin-top:8px;font-size:12px;color:#999;"></span>
          </div>
          <div style="background:#white;padding:16px;border-radius:8px;border:1px solid #ddd;">
            <div style="font-weight:600;margin-bottom:8px;color:#1a1a1a;font-size:14px;">アルキラー（遠隔）</div>
            <input type="file" multiple id="alcohol" style="width:100%;"/>
            <span id="alcoholCount" style="display:block;margin-top:8px;font-size:12px;color:#999;"></span>
          </div>
        </div>
        <button type="button" id="btnStart" class="btn-primary" style="width:100%;padding:12px;font-size:16px;">実行</button>
      </div>
    </div>

    <div id="progressSection" style="display:none; background:#f5f9ff;border:1px solid #dce8f5;border-radius:8px;padding:24px;">
      <p id="progressText" style="margin:0 0 16px 0; font-weight:600;color:#1a1a1a;">処理中…</p>
      <div class="progress-bar">
        <div class="progress-bar-inner" id="progressBar" style="width:0%;"></div>
      </div>
      <p id="progressDetail" style="margin-top:12px; font-size:13px; color:#666;"></p>
    </div>

    <div id="doneSection" style="display:none; background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:24px;">
      <h3 style="margin:0 0 16px 0;color:#15803d;font-size:16px;">処理が完了しました</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button type="button" id="btnToResult" class="btn-primary" style="flex:1;min-width:150px;">結果を確認</button>
        <button type="button" id="btnAgain" class="btn-secondary" style="flex:1;min-width:150px;">別のファイルで再実行</button>
      </div>
    </div>

    <p class="back-home"><a href="index.html">← 最初の画面に戻る</a></p>
  </div>

  <!-- 説明パネル（右サイドバー） -->
  <div class="guide-panel" id="guidePanel">
    <h3>操作ガイド</h3>
    <div id="guideContent"></div>
  </div>

  <script src="app.js"></script>
  <script>
    var DEVICE_DISPLAY = { mimamori: "みまもり", telecom: "テレコム" };
    var params = new URLSearchParams(location.search);
    var company = params.get("company") || "";
    var device = params.get("device") || "";
    var deviceLabel = device ? (DEVICE_DISPLAY[device] || device) : "";

    document.getElementById("deviceLabel").textContent = deviceLabel || "—";
    document.getElementById("digitacoLabel").textContent = deviceLabel || "みまもり / テレコム（デジタコ）";

    var errEl = document.getElementById("err");
    var uploadSection = document.getElementById("uploadSection");
    var progressSection = document.getElementById("progressSection");
    var doneSection = document.getElementById("doneSection");
    var pdfInput = document.getElementById("pdfs");
    var taimenInput = document.getElementById("taimen");
    var alcoholInput = document.getElementById("alcohol");
    var jobId = null;
    var pollTimer = null;
    var lastJobStatus = null;  // 確認なしで完了したときだけ自動DLするため

    function showErr(msg) {
      errEl.textContent = msg || "";
      errEl.style.display = msg ? "block" : "none";
    }

    function updateGuide(title, description, steps) {
      var html = '';
      if (title) {
        html += '<div class="guide-step"><div class="guide-step-title">' + title + '</div>';
        if (description) {
          var descWithBreaks = description.replace(/\n/g, '<br>');
          html += '<div class="guide-step-desc">' + descWithBreaks + '</div>';
        }
        if (steps && steps.length > 0) {
          html += '<ul class="guide-checklist">';
          steps.forEach(function (step) {
            var stepWithBreaks = step.replace(/\n/g, '<br>');
            html += '<li>' + stepWithBreaks + '</li>';
          });
          html += '</ul>';
        }
        html += '</div>';
      }
      document.getElementById("guideContent").innerHTML = html;
    }

    function updateCounts() {
      document.getElementById("pdfCount").textContent = pdfInput.files.length ? pdfInput.files.length + "件" : "";
      document.getElementById("taimenCount").textContent = taimenInput.files.length ? taimenInput.files.length + "件" : "";
      document.getElementById("alcoholCount").textContent = alcoholInput.files.length ? alcoholInput.files.length + "件" : "";
      document.getElementById("btnStart").disabled = pdfInput.files.length === 0;
    }
    pdfInput.addEventListener("change", updateCounts);
    taimenInput.addEventListener("change", updateCounts);
    alcoholInput.addEventListener("change", updateCounts);
    updateCounts();

    updateGuide(
      "ステップ 2/3：ファイルを選択",
      "必要なファイルを\n選択してください。",
      [
        "デジタコ：必須",
        "対面アルコール：選択可",
        "アルキラー（遠隔）：選択可",
        "複数ファイル選択可能",
        "実行ボタンをクリック"
      ]
    );

    document.getElementById("btnStart").addEventListener("click", function () {
      if (pdfInput.files.length === 0) return;
      showErr("");
      var fd = new FormData();
      fd.append("company", company);
      fd.append("device", device);
      for (var i = 0; i < pdfInput.files.length; i++) fd.append("pdfs", pdfInput.files[i]);
      for (var i = 0; i < taimenInput.files.length; i++) fd.append("taimen", taimenInput.files[i]);
      for (var i = 0; i < alcoholInput.files.length; i++) fd.append("alcohol", alcoholInput.files[i]);
      document.getElementById("btnStart").disabled = true;
      document.getElementById("btnStart").textContent = "送信中...";
      updateGuide(
        "ステップ 2/3：アップロード中",
        "ファイルを\nサーバーに送信中です。\n\nしばらくお待ちください。",
        []
      );
      fetch(API_BASE + "/api/jobs", { method: "POST", body: fd })
        .then(function (res) {
          if (!res.ok) return res.text().then(function (t) { throw new Error(t); });
          return res.json();
        })
        .then(function (data) {
          jobId = data.jobId;
          uploadSection.style.display = "none";
          progressSection.style.display = "block";
          document.getElementById("btnStart").disabled = false;
          document.getElementById("btnStart").textContent = "実行";
          poll();
        })
        .catch(function (e) {
          var errMsg = String(e);
          showErr(errMsg);
          updateGuide(
            "エラー",
            errMsg,
            [
              "ファイル形式を確認してください",
              "別のファイルで再度試してください"
            ]
          );
          document.getElementById("btnStart").disabled = false;
          document.getElementById("btnStart").textContent = "実行";
        });
    });

    function poll() {
      if (!jobId) return;
      apiGet("/api/jobs/" + jobId).then(function (j) {
        var pct = j.totalPdfs ? Math.round((100 * j.processedPdfs) / j.totalPdfs) : 0;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progressDetail").textContent = j.processedPdfs + " / " + j.totalPdfs + " PDF 処理済み";
        updateGuide(
          "ステップ 2/3：処理中... (" + pct + "%)",
          "PDFファイルを分析しています。\n電源を切らずにお待ちください。",
          [
            "処理中：" + j.processedPdfs + " / " + j.totalPdfs + " ファイル"
          ]
        );
        if (j.status === "queued" || j.status === "running") {
          pollTimer = setTimeout(poll, 1000);
        } else {
          lastJobStatus = j.status;
          progressSection.style.display = "none";
          doneSection.style.display = "block";
          updateGuide(
            "ステップ 2/3：完了 ✅",
            "ファイルの分析が完了しました。\n「結果を確認する」をクリックしてください。",
            []
          );
        }
      }).catch(function (e) {
        var errMsg = String(e);
        showErr(errMsg);
        updateGuide("エラー", errMsg, []);
      });
    }

    document.getElementById("btnToResult").addEventListener("click", function () {
      var q = "?id=" + encodeURIComponent(jobId);
      if (lastJobStatus === "succeeded") q += "&autodownload=1";
      location.href = "job.html" + q;
    });
    document.getElementById("btnAgain").addEventListener("click", function () {
      jobId = null;
      if (pollTimer) clearTimeout(pollTimer);
      doneSection.style.display = "none";
      uploadSection.style.display = "block";
      /* アップロード済みのファイル選択はそのまま残す（再選択不要） */
      updateCounts();
    });
  </script>
</body>
</html>
